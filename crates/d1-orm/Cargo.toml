[package]
name = "d1-orm"
version = "0.1.0"
edition = "2021"
description = "A lightweight ORM and migration toolkit for Cloudflare D1."
repository = "https://github.com/Asutorufa/housou/tree/master/crates/d1-orm"
license = "MIT"
readme = "README.md"
keywords = ["cloudflare", "d1", "orm", "sqlite", "wasm"]
categories = ["database", "web-programming", "wasm"]

[dependencies]
worker = { version = "0.7.4", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
d1-orm-derive = { path = "../d1-orm-derive" }
serde-wasm-bindgen = "0.6"

[features]
default = []

[dev-dependencies]
wasm-bindgen-test = "0.3"
