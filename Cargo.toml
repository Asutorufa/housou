[package]
name = "housou"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dev = []                       # Use local data.json instead of fetching from GitHub


[dependencies]
passkey-server = { path = "crates/passkey", default-features = false, features = [
    "wasm",
] }
d1-orm = { path = "crates/d1-orm", features = ["d1"] }
worker = { workspace = true, features = ["d1"] }
url = "2.5"
serde = { workspace = true }
serde_derive = "1.0.229"
serde_json = { workspace = true }
console_error_panic_hook = "0.1.7"
regex = "1.13.1"
js-sys = { workspace = true }
futures = "0.3.34"
argon2 = "0.6"
rand_core = "0.10.1"
uuid = { version = "1.26.1", features = ["v4", "rng", "js", "serde"] }
cookie = "0.18"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
async-trait = { workspace = true }
tmdb_client = { git = "https://github.com/asutorufa/tmdb-client-rs.git", rev = "17adf938c1d9831dc150a73d59bf2ec6b186d23c", default-features = false, features = [
    "async",
] }
rust-anilist = { git = "https://github.com/Asutorufa/rust-anilist", rev = "3529c886f47250e8e7419e8c6e1a4a4de4bc681c", default-features = false }
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
serde_repr = "0.1.21"
serde_urlencoded = "0.7.1"
time = { version = "0.3", features = ["macros", "wasm-bindgen", "parsing"] }
html-escape = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# wasm-bindgen needs linker symbols to locate the externref table.
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]
members = ["crates/passkey", "crates/d1-orm"]

[workspace.dependencies]
js-sys = "0.3.106"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1"
tokio = { version = "1.53.1", features = ["full"] }
worker = "0.8.7"

[dev-dependencies]
d1-orm = { path = "crates/d1-orm", features = ["sqlite"] }
rusqlite = { workspace = true }
tokio = { workspace = true }
