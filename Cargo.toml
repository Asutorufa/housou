[package]
name = "housou"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
dev = []     # Use local data.json instead of fetching from GitHub

[dependencies]
worker = { version = "0.7.4", features = ["d1"] }
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
console_error_panic_hook = "0.1.7"
worker-macros = "0.7.4"
regex = "1.12.3"
js-sys = "0.3.77"
futures = "0.3.32"
bcrypt = "0.18"
uuid = { version = "1.8", features = ["v4", "fast-rng", "js", "serde"] }
cookie = "0.18"
getrandom = "0.4"
async-trait = "0.1"
tmdb_client = { git = "https://github.com/asutorufa/tmdb-client-rs.git", rev = "913f798021464dffdc21f41d12c5a6b2475ff100", default-features = false, features = [
    "async",
] }
rust-anilist = { git = "https://github.com/Asutorufa/rust-anilist", rev = "f3074c0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
