name: Lint Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Fix Rust Formatting
        run: cargo fmt --all

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Frontend node_modules
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install Frontend Dependencies
        working-directory: web
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Fix Frontend Formatting
        working-directory: web
        run: npm run format

      - name: Fix Frontend Lints
        working-directory: web
        run: npm run lint:fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated code style fixes"
          title: "chore: automated code style fixes"
          body: "Automated fixes for code style issues found in the codebase."
          branch: "automated-style-fixes"
          base: "main"
